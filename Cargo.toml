[package]
name = "cloudpanel"
version = "0.3.4"
edition = "2021"
rust-version = "1.80"
description = "High-performance, ultra-lightweight, and secure server control panel written in Rust"
authors = ["CloudPanel Rust Contributors"]
license = "MIT"
repository = "https://github.com/marwinlewis/cloudpanel-rust"

[dependencies]
# Async runtime & Web framework
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tower-http = { version = "0.6", features = ["compression-full", "set-header", "limit"] }

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Database (Embedded SQLite with connection pooling)
rusqlite = { version = "0.41", features = ["bundled", "chrono"] }
r2d2 = "0.8"

# Security & Cryptography
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9.3"
rand = "0.8"

# System monitoring
sysinfo = "0.32"

# CLI & Configuration
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Asset Embedding (for single-binary distribution)
rust-embed = { version = "8.5" }
mime_guess = "2.0"
sha2 = "0.10"
base64 = "0.22"
x509-parser = "0.16"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusty-s3 = "0.5"
chacha20poly1305 = "0.10"
futures-util = "0.3"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
qrcode = { version = "0.14", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(sec_open)'] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Optimize dependencies in dev builds (Argon2 is extremely slow unoptimized).
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
