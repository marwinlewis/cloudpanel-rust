  <!-- Sign in -->
  <div id="login" class="login" hidden>
    <div class="login-card">
      <div class="brand"><span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>CloudPanel</div>
      <h1>Sign in</h1>
      <p class="sub">Manage your server, sites and containers.</p>
      <form id="login-form" class="panel form" novalidate>
        <div class="field">
          <label for="login-username">Username</label>
          <input class="input" id="login-username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="alert error" role="alert" hidden></div>
        <button class="btn primary block" type="submit" id="login-submit">Sign in</button>
      </form>
      <form id="mfa-form" class="panel form" novalidate hidden>
        <div class="field">
          <label for="mfa-code">Authentication code</label>
          <input class="input mono" id="mfa-code" name="code" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" placeholder="123456">
          <div class="hint">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</div>
        </div>
        <div id="mfa-error" class="alert error" role="alert" hidden></div>
        <button class="btn primary block" type="submit" id="mfa-submit">Verify</button>
        <button class="btn ghost block" type="button" id="mfa-back">Back</button>
      </form>
      <p id="login-insecure" class="hint login-note" hidden>
        This connection isn't encrypted. Configure TLS before using the panel over the internet.
      </p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>CloudPanel</div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <span class="avatar" id="user-initial">a</span>
        <div class="grow">
          <div class="truncate strong" id="user-name">admin</div>
          <div class="small faint" id="user-role">Administrator</div>
        </div>
        <button class="icon-btn" id="logout-btn" title="Sign out" aria-label="Sign out"><svg class="icon"><use href="#i-logout"/></svg></button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"><svg class="icon lg"><use href="#i-menu"/></svg></button>
        <div class="grow">
          <h1 id="page-title">Overview</h1>
          <div class="sub truncate" id="page-sub"></div>
        </div>
        <div id="page-actions" class="row"></div>
        <span class="server-chip" id="server-chip" hidden><span class="dot ok"></span><span id="server-host"></span></span>
        <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"><svg class="icon"><use href="#i-moon"/></svg></button>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
