name: Release

# Push a tag like v0.2.0 to build static Linux binaries and publish a GitHub release.
# Or run it manually from the Actions tab ("Run workflow") with a new tag name; the
# tag is then created on the selected branch's latest commit.
# install.sh downloads `cloudpanel-linux-<arch>` and verifies `<asset>.sha256`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.3.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      # The panel reports this version and compares it with the latest release's tag, so it must
      # be the tag's: otherwise a server on the latest release would be told to update, forever.
      - name: Set the version from the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tags look like v1.2.3 or v1.2.3-rc1, not '$TAG'"
            exit 1
          fi
          sed -i "0,/^version = .*/s//version = \"$version\"/" Cargo.toml
          cargo update --workspace
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          asset=cloudpanel-linux-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/cloudpanel "$asset"
          sha256sum "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cloudpanel-${{ matrix.arch }}
          path: cloudpanel-linux-${{ matrix.arch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
