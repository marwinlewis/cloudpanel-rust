name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for advisories published against dependencies that haven't changed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Check UI JavaScript syntax
        run: |
          files=$(git ls-files 'ui/*.js')
          [ -n "$files" ] || { echo "no UI JavaScript files found"; exit 1; }
          for f in $files; do node --check "$f"; done
      - name: shellcheck
        run: |
          shellcheck install.sh
          shellcheck -S warning scripts/debian-e2e/security.sh

  # Known vulnerabilities, licences and where crates come from (deny.toml). Separate, so a new
  # advisory against a dependency shows up as its own failure.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit --deny warnings
      - run: cargo deny check

  # Attacks on a real install (scripts/debian-e2e/security.sh). Too slow for every push.
  security-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: scripts/debian-e2e/run.sh --security
